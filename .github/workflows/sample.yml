name: sample
on: push

jobs:
  create_diff_report_by_sample:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ github.ref_name != github.event.repository.default_branch && format('{0}-cargo-', runner.os) }}

      - uses: actions/cache@v6.1.0
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ github.ref_name != github.event.repository.default_branch && format('{0}-cargo-build-', runner.os) }}

      - run: cargo fetch --locked

      - run: cargo build --release --locked

      - run: time ./target/release/semdiff ./sample_data/expected ./sample_data/actual --json-ignore-path "$.ignored_path" --output-html ./out/index.html

      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: out

  deploy:
    if: github.ref_name == github.event.repository.default_branch
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: create_diff_report_by_sample
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
